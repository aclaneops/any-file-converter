<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal File Converter & Compressor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    <nav class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-sync-alt text-2xl mr-3"></i>
                    <span class="font-bold text-xl">AnyConvert</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-4">Convert & Compress Any File</h1>
            <p class="text-lg text-gray-600">Fast, secure, and running locally on your machine. No data leaves your computer.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8">
            <form id="convert-form" class="space-y-6">
                
                <!-- Tool Selection -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Select Tool</label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <label class="tool-card relative flex cursor-pointer rounded-lg border bg-white p-4 shadow-sm focus:outline-none">
                            <input type="radio" name="conversion_type" value="pdf-to-word" class="sr-only" checked>
                            <span class="flex flex-1">
                                <span class="flex flex-col items-center w-full text-center">
                                    <i class="fas fa-file-word text-blue-500 text-3xl mb-2"></i>
                                    <span class="block text-sm font-medium text-gray-900">PDF to Word</span>
                                </span>
                            </span>
                        </label>

                        <label class="tool-card relative flex cursor-pointer rounded-lg border bg-white p-4 shadow-sm focus:outline-none">
                            <input type="radio" name="conversion_type" value="pdf-to-excel" class="sr-only">
                            <span class="flex flex-1">
                                <span class="flex flex-col items-center w-full text-center">
                                    <i class="fas fa-file-excel text-green-500 text-3xl mb-2"></i>
                                    <span class="block text-sm font-medium text-gray-900">PDF to Excel</span>
                                </span>
                            </span>
                        </label>
                        
                        <label class="tool-card relative flex cursor-pointer rounded-lg border bg-white p-4 shadow-sm focus:outline-none">
                            <input type="radio" name="conversion_type" value="pdf-to-ppt" class="sr-only">
                            <span class="flex flex-1">
                                <span class="flex flex-col items-center w-full text-center">
                                    <i class="fas fa-file-powerpoint text-orange-500 text-3xl mb-2"></i>
                                    <span class="block text-sm font-medium text-gray-900">PDF to PPT</span>
                                </span>
                            </span>
                        </label>

                        <label class="tool-card relative flex cursor-pointer rounded-lg border bg-white p-4 shadow-sm focus:outline-none">
                            <input type="radio" name="conversion_type" value="word-to-ppt" class="sr-only">
                            <span class="flex flex-1">
                                <span class="flex flex-col items-center w-full text-center">
                                    <i class="fas fa-file-powerpoint text-orange-400 text-3xl mb-2"></i>
                                    <span class="block text-sm font-medium text-gray-900">Word to PPT</span>
                                </span>
                            </span>
                        </label>
                        
                        <label class="tool-card relative flex cursor-pointer rounded-lg border bg-white p-4 shadow-sm focus:outline-none">
                            <input type="radio" name="conversion_type" value="ppt-to-word" class="sr-only">
                            <span class="flex flex-1">
                                <span class="flex flex-col items-center w-full text-center">
                                    <i class="fas fa-file-word text-blue-400 text-3xl mb-2"></i>
                                    <span class="block text-sm font-medium text-gray-900">PPT to Word</span>
                                </span>
                            </span>
                        </label>
                        
                        <label class="tool-card relative flex cursor-pointer rounded-lg border bg-white p-4 shadow-sm focus:outline-none">
                            <input type="radio" name="conversion_type" value="image-to-word" class="sr-only">
                            <span class="flex flex-1">
                                <span class="flex flex-col items-center w-full text-center">
                                    <i class="fas fa-file-image text-purple-500 text-3xl mb-2"></i>
                                    <span class="block text-sm font-medium text-gray-900">Image to Word</span>
                                </span>
                            </span>
                        </label>

                        <label class="tool-card relative flex cursor-pointer rounded-lg border bg-white p-4 shadow-sm focus:outline-none">
                            <input type="radio" name="conversion_type" value="compress" class="sr-only">
                            <span class="flex flex-1">
                                <span class="flex flex-col items-center w-full text-center">
                                    <i class="fas fa-compress-arrows-alt text-gray-600 text-3xl mb-2"></i>
                                    <span class="block text-sm font-medium text-gray-900">Compress File</span>
                                </span>
                            </span>
                        </label>
                    </div>
                </div>

                <!-- File Upload -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Upload File</label>
                    <div id="drop-zone" class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:border-indigo-500 transition-colors bg-gray-50">
                        <div class="space-y-1 text-center">
                            <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-3"></i>
                            <div class="flex text-sm text-gray-600 justify-center">
                                <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-indigo-600 hover:text-indigo-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-indigo-500 px-2 py-1">
                                    <span>Select a file</span>
                                    <input id="file-upload" name="file-upload" type="file" class="sr-only" required>
                                </label>
                                <p class="pl-1 py-1">or drag and drop</p>
                            </div>
                            <p class="text-xs text-gray-500" id="file-name">Any supported format up to 50MB</p>
                        </div>
                    </div>
                </div>

                <div id="error-message" class="hidden rounded-md bg-red-50 p-4">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <i class="fas fa-times-circle text-red-400"></i>
                        </div>
                        <div class="ml-3">
                            <h3 class="text-sm font-medium text-red-800" id="error-text">Error occurred</h3>
                        </div>
                    </div>
                </div>

                <div>
                    <button type="submit" id="submit-btn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        <span>Convert Now</span>
                        <i id="spinner" class="fas fa-circle-notch fa-spin ml-2 hidden items-center"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-sm text-gray-500">
                &copy; 2024 AnyConvert. Built for personal use.
            </p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
